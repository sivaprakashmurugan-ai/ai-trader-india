
version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ai_trader_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: ai_trader_api
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/usr/src/app/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestor:
    build:
      context: ./backend
    container_name: ai_trader_ingestor
    command: python -m app.data.ingest
    volumes:
      - ./backend/app:/usr/src/app/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  trainer:
    build:
      context: ./backend
    container_name: ai_trader_trainer
    command: python -m app.models.train
    volumes:
      - ./backend/app:/usr/src/app/app
      - model_store:/usr/src/app/model_store
    env_file:
      - .env
    depends_on:
      ingestor:
        condition: service_started # Or a more robust check
    restart: 'no' # Typically runs once

  agent:
    build:
      context: ./backend
    container_name: ai_trader_agent
    command: python -m app.agent.core
    volumes:
      - ./backend/app:/usr/src/app/app
      - model_store:/usr/src/app/model_store
    env_file:
      - .env
    depends_on:
      trainer:
        condition: service_completed_successfully
      ingestor:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: ai_trader_frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  model_store:
